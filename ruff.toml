line-length = 120
target-version = "py311"
src = ["src", "tests"]

[lint]
select = [
    "E",    # pycodestyle 错误
    "F",    # pyflakes：未使用导入/变量、未定义名称
    "I",    # isort：导入排序
    "UP",   # pyupgrade：过时写法
    "B",    # flake8-bugbear：常见陷阱
    "TID",  # flake8-tidy-imports：禁止相对导入
]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"
