[project]
name = "teamai"
version = "0.1.0"
description = "团队协作 AI（对标 Claude Tag）：嵌入企业通讯平台的共享 AI 协作成员"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "slack-bolt>=1.21",
    # slack_bolt.async_app.AsyncApp 依赖 aiohttp，但 slack-bolt 未声明它
    # （既不在必需依赖也无对应 extra），不显式声明则 teamai.main 无法导入。
    "aiohttp>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pydantic-ai>=2.0.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "apscheduler>=3.10",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "F",    # pyflakes：未使用导入/变量、未定义名称
    "I",    # isort：导入排序
    "UP",   # pyupgrade：过时写法
    "B",    # flake8-bugbear：常见陷阱
    "TID",  # flake8-tidy-imports：禁止相对导入
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
