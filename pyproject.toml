[project]
name = "teamai"
version = "0.1.0"
description = "团队协作 AI（对标 Claude Tag）：嵌入企业通讯平台的共享 AI 协作成员"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "slack-bolt>=1.21",
    # slack_bolt.async_app.AsyncApp 依赖 aiohttp，但 slack-bolt 未声明它
    # （既不在必需依赖也无对应 extra），不显式声明则 adapters.slack_app 无法导入。
    "aiohttp>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # config.yaml 的加载用 pydantic-settings 的 YamlConfigSettingsSource，
    # 它需要 pyyaml，但只在 pydantic-settings 的 yaml extra 里声明；
    # 不显式声明则 teamai.config 在干净环境下 import 即报错。
    "pyyaml>=6.0",
    "pydantic-ai>=2.0.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "apscheduler>=3.10",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teamai"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
