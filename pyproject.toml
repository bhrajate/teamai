[project]
name = "teamai"
version = "0.1.0"
description = "团队协作 AI（对标 Claude Tag）：嵌入企业通讯平台的共享 AI 协作成员"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "slack-bolt>=1.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pydantic-ai>=2.0.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "apscheduler>=3.10",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teamai = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
