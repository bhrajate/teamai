[project]
name = "teamai"
version = "0.1.0"
description = "团队协作 AI（对标 Claude Tag）：嵌入企业通讯平台的共享 AI 协作成员"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "slack-bolt>=1.21",
    # slack_bolt.async_app.AsyncApp 依赖 aiohttp，但 slack-bolt 未声明它
    # （既不在必需依赖也无对应 extra），不显式声明则 adapters.slack_app 无法导入。
    "aiohttp>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # config.yaml 的加载用 pydantic-settings 的 YamlConfigSettingsSource，
    # 它需要 pyyaml，但只在 pydantic-settings 的 yaml extra 里声明；
    # 不显式声明则 teamai.config 在干净环境下 import 即报错。
    "pyyaml>=6.0",
    "pydantic-ai>=2.0.0",
    "sqlalchemy>=2.0",
    # 飞书回调的 AES 解密与签名校验（adapters/feishu/crypto.py）
    "cryptography>=42.0",
    # 飞书 SDK：事件长连接、消息回复。
    # 下界必须 >=1.6.0：adapters/feishu/connector.py 用的
    # lark_oapi.channel.bot_identity.fetch_bot_identity 是 1.6.0 才有的
    # （1.4.x / 1.5.x 的 wheel 里没有 lark_oapi/channel/ 这个包），
    # 放宽到 1.5.x 会在 import 时炸。
    "lark-oapi>=1.6.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "apscheduler>=3.10",
    "qdrant-client>=1.12",
    "alembic>=1.13",
    # 指标暴露（infrastructure/metrics.py + web 的 /metrics）。
    # 下界 0.21：multiprocess 模式下 `MultiProcessCollector` 的 mmap 文件格式在
    # 0.21 定型，更早的版本与新版写入的文件不兼容 —— 而 worker 与 web 是两个
    # 进程、可能不同时升级，格式不兼容时 /metrics 会读出空指标且不报错。
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    # 仓储层的真 SQL 行为测试用内存 SQLite。生产走 asyncpg，但「merge 按主键
    # 匹配、故换 id 就是 INSERT」这类语义与方言无关，用 SQLite 验足够且不必起容器。
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teamai"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
