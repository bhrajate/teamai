services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: teamai
      POSTGRES_PASSWORD: teamai
      POSTGRES_DB: teamai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  qdrant_data:
