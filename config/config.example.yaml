# TeamAI 项目配置示例
#
# 用法：拷一份为 config.yaml（已在 .gitignore 中），按需改动。
#   cp config.example.yaml config.yaml
#
# 这里只放**非敏感可调项**。凭据与连接串（Slack token、LLM_API_KEY / LLM_BASE_URL、
# DATABASE_URL / REDIS_URL / QDRANT_URL）走 .env，见 .env.example ——
# 它们每套环境都不同，也不该出现在任何可能被提交的文件里。
#
# 优先级：环境变量 > .env > config.yaml > 代码里的字段默认值（src/teamai/config.py）。
# 本文件缺失或留空都不会报错，直接回落默认值；下面每项都是当前默认值。
#
# 嵌套分组只为可读，加载时按下划线展平成平铺字段：
#   model.light_primary -> settings.model_light_primary
# 故新增分组时留意展平后的名字要与 Settings 的字段名对得上。

# LLM 模型分级。轻量任务用 light（primary 不可用时降级到 fallback），
# 推理链长或改动有风险的任务用 full，映射见 application/intent.py。
#
# 取 `provider:model` 形式 —— **provider 段同时决定协议与端点**，换供应商只改
# 这三行，不动代码。不带前缀的裸名按 anthropic 处理（兼容旧配置）。
#
# 前缀 → 协议：
#   anthropic:      /v1/messages            Anthropic 原生
#   openai-chat:    /v1/chat/completions    第三方中转/自建网关多为此种
#   openai:         /v1/responses           OpenAI 官方给新项目推荐的协议
#   deepseek: moonshotai: zai: ...          自带固定端点，忽略 LLM_BASE_URL
#   ollama: litellm: openrouter: ...        需配 LLM_BASE_URL 指向实例
# 全表见 pydantic-ai 的 providers 目录（另有 azure/google/bedrock/xai/groq 等）。
#
# ⚠️ 换供应商时 .env 的 LLM_API_KEY / LLM_BASE_URL 要一起改，两边不配套会 401
# 或打错端点。下面每个例子都标了它需要的 .env，成套复制。

# —— 默认：Anthropic 官方 ——
# .env: LLM_API_KEY=sk-ant-xxx   （LLM_BASE_URL 留空）
model:
  light_primary: claude-sonnet-4-5
  light_fallback: claude-3-5-haiku
  full: claude-opus-4-8

# —— 例 1：Anthropic 协议的中转站 ——
# 模型名照写，只在 .env 里指端点。
# .env: LLM_API_KEY=sk-xxx
#       LLM_BASE_URL=https://your-relay.example.com
#model:
#  light_primary: anthropic:claude-sonnet-4-5
#  light_fallback: anthropic:claude-3-5-haiku
#  full: anthropic:claude-opus-4-8

# —— 例 2：OpenAI 兼容网关（chat/completions，最常见的中转形态）——
# .env: LLM_API_KEY=sk-xxx
#       LLM_BASE_URL=https://your-gateway.example.com/v1
#model:
#  light_primary: openai-chat:gpt-5-mini
#  light_fallback: openai-chat:gpt-5-nano
#  full: openai-chat:gpt-5

# —— 例 3：OpenAI 官方（responses 协议）——
# .env: LLM_API_KEY=sk-xxx      （LLM_BASE_URL 留空）
#model:
#  light_primary: openai:gpt-5-mini
#  light_fallback: openai:gpt-5-nano
#  full: openai:gpt-5

# —— 例 4：DeepSeek 官方（自带端点，LLM_BASE_URL 必须留空否则被忽略）——
# .env: LLM_API_KEY=sk-xxx
#model:
#  light_primary: deepseek:deepseek-chat
#  light_fallback: deepseek:deepseek-chat
#  full: deepseek:deepseek-reasoner

# —— 例 5：本地 Ollama（无需 key，但字段不能空着）——
# .env: LLM_API_KEY=ollama
#       LLM_BASE_URL=http://localhost:11434/v1
#model:
#  light_primary: ollama:qwen3
#  light_fallback: ollama:qwen3
#  full: ollama:qwen3

# —— 例 6：混用不同供应商省钱（light 走便宜的，full 留旗舰）——
# 注意 LLM_BASE_URL 是全局一份，混用时只有接受 base_url 的 provider 会用它；
# 所以这种配法最好让各家都走官方端点（LLM_BASE_URL 留空），或全部用同一个网关。
# .env: LLM_API_KEY=sk-xxx      （LLM_BASE_URL 留空）
#model:
#  light_primary: deepseek:deepseek-chat
#  light_fallback: deepseek:deepseek-chat
#  full: anthropic:claude-opus-4-8

# 长任务队列（Redis list）。name 是 Redis 里的键名。
queue:
  name: teamai-tasks

# Slack 事件去重记录的存活时间（秒）。默认 1 小时以覆盖 Slack 的重投窗口
# （官方三次重投在约半小时内发完），到期即淘汰以免白占内存。
event_dedup:
  ttl_seconds: 3600

# 向量库集合名。连接地址 QDRANT_URL 走 .env。
qdrant:
  collection: teamai-memory

# 文本向量化。留空 model 即关闭语义检索：记忆检索回落到「按时间倒序取最近若干
# 条」，功能退化但不报错。凭据（EMBEDDING_API_KEY）走 .env，留空则复用
# LLM_API_KEY —— 多数部署里 embedding 与对话走同一个网关、同一把 key。
#
# ⚠️ dimensions 必须与所选模型一致，且 Qdrant 的集合维度创建后不可改：
# 换模型且维度变化时，要么删掉旧集合重启（记忆条目仍在 Postgres，向量索引重建），
# 要么换一个上面的 collection 名。
#
# 常见取值：
#   text-embedding-3-small / bge-large-zh → 1536
#   bge-small-zh                          → 512
#   multilingual-e5-small                 → 384
# 端点与凭据都走 .env（EMBEDDING_BASE_URL / EMBEDDING_API_KEY）：它们是连接串
# 与凭据，与 LLM_BASE_URL 同一处理。
embedding:
  model: ""  # 例：text-embedding-3-small
  dimensions: 1536

# 线程历史：按需向平台拉取，不自建消息镜像表（理由见
# docs/Design-conversation-context.md §2）。
conversation:
  # 单次拉取条数上限。再多也会被下方 context.max_messages 压缩掉。
  history_limit: 30
  # 缓存时长。缓存会自更新 —— 每条经手的消息（用户发的、机器人回的）都会
  # append 进去，所以这个值不决定历史的新鲜度，只决定「多久由平台数据整体
  # 校准一次」。调大省平台配额（Slack 对非 Marketplace 应用的相关配额收紧过），
  # 调小校准更勤，两头都不会让机器人看不见刚发的消息。
  cache_ttl_seconds: 45

# 记忆蒸馏：非 @ 消息先进 Redis 滚动窗口，成窗后由 worker 跑一次轻量模型
# 提炼成结论，原文随即丢弃 —— 聊天原文不入库。
memory:
  # 窗口攒够这么多条就蒸馏一次
  window_size: 20
  # 窗口静置超过这么久也蒸馏，避免冷清频道的对话一直攒着不落地
  window_idle_seconds: 600
  # 手工写入（控制台 / Admin API）时判「疑似与已有记忆冲突」的余弦相似度阈值。
  # 命中就返回 409 带候选列表，由录入人选「取代第 k 条」还是「并列写入」。
  #
  # 调高 = 少拦，漏掉的冲突还有读取侧的日期裁决兜着（Agent 上下文里每条记忆都
  # 带写入日期，说法不一致时以晚的为准）。调低 = 多拦，但动辄拦下不相干的写入
  # 会让人学会无脑点「并列写入」，那时这道检查就白设了。
  #
  # ⚠️ 含义取决于向量库建集合时的距离度量（当前 Cosine，取值 [0,1] 越大越像）。
  conflict_threshold: 0.85
  # 未配 embedding 时这道检查退化为字面比对，扫描多少条现行记忆。
  # 降级路径只能查出字面重复、查不出语义矛盾，不该为它做全表扫描。
  conflict_scan_limit: 50

# 记忆向量投影：worker 里的常驻循环，消费 memory_outbox 把向量写进向量库。
# 记忆写入与「该重算向量」的意图同事务落库，向量由这个循环异步补上 ——
# 所以「刚写入到能被语义检索」之间有个可观测的延迟（lag 指标）。
# 设计见 docs/plan-memory-outbox.md。
projector:
  # 空转时的轮询间隔（秒）。取 2 秒而非分钟级：蒸馏刚提炼出一条结论，
  # 紧接着的提问就该能命中它。
  poll_interval_seconds: 2.0
  # 一轮领取多少条
  batch_size: 32
  # 租约时长（秒）。必须显著大于单次 embedding 调用的最坏耗时，
  # 提前过期会让另一个实例重复处理同一条（无害但白烧一次 embedding）。
  lease_seconds: 300
  # 重试几次后转死信。11 次的指数退避累计约 20 分钟（单次封顶 300 秒）。
  max_attempts: 11

# Agent 交互记录：存实际组装出的提示词、模型响应、分拆的 in/out token。
# 补的是审计的缺口 —— audit_logs 只记动作枚举，还原不出「模型当时看到了什么」。
interactions:
  # 保留期。<= 0 表示不清理（留给「合规要求永久留存」的部署）。
  # 这张表含全文，不清理会无限增长；且保留期是对外承诺的一部分，不执行等于没承诺。
  retention_days: 90

# token 预算的统计周期。周期走满后由 worker 的定时任务清零用量（见下方 jobs），
# 没有那道巡检的话，配额耗尽的频道会永久停在 EXHAUSTED。
budget:
  period: MONTHLY  # MONTHLY | DAILY | WEEKLY

# worker 进程里的定时任务（app/worker/main.py 的 register_jobs）。
jobs:
  # 巡检频率。预算重置与超时巡检共用这个间隔，两者都只扫一遍表，跑得更密无收益。
  sweep_interval_minutes: 10
  # PENDING 超时：任务已入队却迟迟没被取走。队列正常时是秒级出队，
  # 半小时没动说明 worker 全挂了或载荷坏了 —— 判为 FAILED 并留审计。
  pending_timeout_minutes: 30
  # RUNNING 超时：已被取走、执行中。长任务设计上是小时/天级，故给足 24h；
  # 超过它更可能是 worker 崩在半路 —— 此时若该任务有执行检查点，巡检会重新
  # 入队让它从最近一个工具轮边界续跑，而不是直接判死。
  running_timeout_minutes: 1440
  # 单个任务最多从检查点续跑几次，超过即判为 FAILED。
  #
  # 有上限而非无限重试：每次都崩在同一处的任务（外部服务挂了、模型进了死循环）
  # 会一直续跑一直烧 token，而每次续跑都要重发累积历史，越跑越贵。
  # 3 次足够跨过一次部署或一次外部抖动。
  #
  # 设为 0 即关闭续跑：崩溃一律判死（改造前的行为）。
  max_resume_attempts: 3
  # 交互记录保留期清理的间隔，与上面的 sweep 分开：保留期是天级的，
  # 跑得比这密只是白扫表。默认一天一次。
  purge_interval_minutes: 1440

# Admin API 监听地址与跨源放行。
# 访问令牌不在这里 —— 它属凭据，见 .env 的 ADMIN_API_TOKEN。
admin_api:
  host: 0.0.0.0
  port: 8000
  # 控制台前端（web/）独立部署时是另一个源，必须把它的来源列出来，
  # 否则浏览器会拦掉全部 /api 请求。逗号分隔，留空即不启用 CORS 中间件。
  #
  # 本地开发不用配：`make web-dev` 的 vite dev server 把 /api 代到本机 8000，
  # 前后端同源。只有把 web/dist 部署到独立静态站时才需要这一项。
  #
  #   cors_origins: https://teamai-console.example.com,http://localhost:4173
  cors_origins: ""

# 平台接入方式。auto 保持旧行为：配了 SLACK_APP_TOKEN 走 Socket Mode，
# 否则走 Events API（需公网可达的回调 URL）。
platforms:
  slack:
    mode: auto  # auto | events | socket
  feishu:
    # auto：配了 FEISHU_ENCRYPT_KEY + FEISHU_VERIFICATION_TOKEN 走 callback
    # （HTTP 回调，需公网可达的回调 URL），否则走 ws（长连接，无需公网入口）
    mode: auto  # auto | callback | ws
    domain: feishu  # feishu | lark（国际版 open.larksuite.com）

# 上下文压缩：超过 max_messages 条后按最近优先裁剪，
# 超过 summary_threshold 条则把更早的历史摘要化，防止上下文溢出。
context:
  max_messages: 60
  summary_threshold: 120
